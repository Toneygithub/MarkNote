<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea">
  <title>马克笔记 · 本地笔记</title>
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('mark.theme.v1');
        if (savedTheme === 'dark' || savedTheme === 'light') document.documentElement.dataset.theme = savedTheme;
      } catch (error) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell" data-testid="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="笔记列表">
      <div class="sidebar-top">
        <div class="brand-row">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">墨</div>
            <div class="brand-copy">
              <h1 class="brand-title">马克笔记</h1>
              <p class="brand-subtitle">LOCAL NOTES</p>
            </div>
          </div>
          <button class="theme-button" id="themeButton" type="button" aria-label="切换到深色模式" title="切换主题">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
          </button>
        </div>
        <button class="new-note-button" id="newNoteButton" type="button" data-testid="new-note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>新建笔记</span>
        </button>
      </div>

      <div class="sidebar-controls">
        <label class="search-box">
          <span class="sr-only">搜索笔记</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
          <input class="search-input" id="searchInput" type="search" placeholder="搜索标题或正文…" autocomplete="off" data-testid="search">
          <button class="search-clear" id="searchClear" type="button" aria-label="清除搜索" title="清除搜索">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
          </button>
        </label>
        <div class="filters" role="tablist" aria-label="笔记筛选">
          <button class="filter-button active" type="button" role="tab" aria-selected="true" data-filter="all">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
            全部
          </button>
          <button class="filter-button" type="button" role="tab" aria-selected="false" data-filter="favorites">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg>
            收藏
          </button>
        </div>
      </div>

      <div class="list-heading">
        <span>我的笔记</span>
        <span id="noteCount">0 篇</span>
      </div>
      <div class="note-list" id="noteList" role="listbox" aria-label="笔记" data-testid="note-list"></div>
      <div class="sidebar-footer">
        <span class="storage-state"><span class="storage-dot" aria-hidden="true"></span>仅保存在此设备</span>
        <span class="shortcut-hint">Ctrl N</span>
      </div>
    </aside>

    <main class="editor-pane" id="editorPane">
      <header class="editor-toolbar">
        <div class="toolbar-lead">
          <button class="mobile-back" id="mobileBackButton" type="button" aria-label="返回笔记列表" title="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="breadcrumb" id="breadcrumb">所有笔记 <span class="breadcrumb-separator">/</span> 未选择</div>
        </div>
        <div class="toolbar-actions">
          <button class="icon-button favorite-button" id="favoriteButton" type="button" aria-label="收藏当前笔记" aria-pressed="false" title="收藏" data-testid="favorite">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg>
            <span>收藏</span>
          </button>
          <button class="icon-button delete-button" id="deleteButton" type="button" aria-label="删除当前笔记" title="删除" data-testid="delete">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>
            <span>删除</span>
          </button>
        </div>
      </header>

      <section class="editor-content" id="editorContent">
        <div class="editor-paper" id="editor" data-testid="editor">
          <div class="editor-meta">
            <span class="meta-chip" id="metaChip">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg>
              <span id="metaChipText">笔记</span>
            </span>
            <span id="lastEdited">尚未编辑</span>
          </div>
          <label>
            <span class="sr-only">笔记标题</span>
            <input class="title-input" id="titleInput" type="text" maxlength="100" placeholder="无标题笔记" autocomplete="off" data-testid="title-input">
          </label>
          <div class="editor-rule" aria-hidden="true"></div>
          <label>
            <span class="sr-only">笔记正文</span>
            <textarea class="content-input" id="contentInput" maxlength="20000" placeholder="写点什么吧…" data-testid="content-input"></textarea>
          </label>
        </div>

        <div class="empty-editor" id="emptyEditor" hidden data-testid="empty-editor">
          <div class="empty-editor-inner">
            <div class="empty-editor-art" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h10l4 4v12H5z"/><path d="M15 4v4h4M8 13h8M8 17h5"/></svg>
            </div>
            <h2>写下此刻的想法</h2>
            <p>每一篇笔记都会自动保存在浏览器中。创建一篇新笔记，开始记录灵感、计划或生活。</p>
            <button class="new-note-button" id="emptyNewNoteButton" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              <span>新建笔记</span>
            </button>
          </div>
        </div>
      </section>

      <footer class="editor-status">
        <span class="save-state" id="saveState" data-saving="false">所有更改已保存</span>
        <span id="wordCount">0 字</span>
      </footer>
    </main>
  </div>

  <div class="modal" id="deleteModal" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle" aria-describedby="deleteModalText" hidden data-testid="delete-modal">
    <div class="modal-card">
      <div class="modal-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>
      </div>
      <h2 id="deleteModalTitle">删除这篇笔记？</h2>
      <p id="deleteModalText">“<span class="modal-note-name" id="deleteNoteName">无标题笔记</span>”将被永久删除，此操作无法撤销。</p>
      <div class="modal-actions">
        <button class="modal-button" id="cancelDeleteButton" type="button" data-testid="cancel-delete">取消</button>
        <button class="modal-button danger" id="confirmDeleteButton" type="button" data-testid="confirm-delete">确认删除</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
    <span id="toastText">已保存</span>
  </div>
  <script src="app.js"></script>
</body>
</html>

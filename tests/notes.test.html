<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>马克笔记自动化测试</title>
  <style>
    :root { font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif; color: #20302c; background: #eef2ef; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 22px; }
    #summary { padding: 9px 14px; border-radius: 999px; color: #73520f; background: #fff1c9; font-weight: 700; }
    #summary[data-status="passed"] { color: #135c45; background: #d8f1e6; }
    #summary[data-status="failed"] { color: #8d2f2b; background: #f9dedb; }
    iframe { display: block; width: 100%; height: 720px; border: 1px solid #cad5d0; border-radius: 16px; background: white; }
    #results { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 8px; padding: 0; margin: 18px 0 0; list-style: none; }
    .test-result { padding: 10px 12px; border: 1px solid #d5dfdb; border-radius: 10px; background: #fff; font-size: 13px; }
    .test-result.pass { border-left: 4px solid #279270; }
    .test-result.fail { border-left: 4px solid #c34842; background: #fff5f4; }
    .test-result strong { display: block; margin-bottom: 3px; }
    .test-result small { color: #65716d; overflow-wrap: anywhere; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
  </style>
</head>
<body>
  <header>
    <h1>马克笔记自动化测试</h1>
    <div id="summary" data-status="running">测试进行中…</div>
  </header>
  <iframe id="appFrame" title="待测试的马克笔记应用"></iframe>
  <ol id="results" aria-live="polite"></ol>

  <script>
    (function () {
      "use strict";

      var frame = document.getElementById("appFrame");
      var summary = document.getElementById("summary");
      var results = document.getElementById("results");
      var records = [];

      function wait(ms) {
        return new Promise(function (resolve) { setTimeout(resolve, ms); });
      }

      function assert(name, condition, details) {
        records.push({ name: name, passed: Boolean(condition), details: details || "" });
      }

      function loadFrame(source) {
        return new Promise(function (resolve, reject) {
          var timer = setTimeout(function () {
            reject(new Error("加载超时：" + source));
          }, 8000);
          frame.addEventListener("load", function onLoad() {
            clearTimeout(timer);
            frame.removeEventListener("load", onLoad);
            wait(80).then(resolve);
          }, { once: true });
          frame.src = source;
        });
      }

      function click(element) {
        element.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: frame.contentWindow }));
      }

      function setInput(element, value) {
        element.value = value;
        element.dispatchEvent(new Event("input", { bubbles: true }));
      }

      function cardText(card) {
        return card.textContent.replace(/\s+/g, " ").trim();
      }

      function storedNotes(appWindow) {
        return JSON.parse(appWindow.localStorage.getItem("mark.notes.v1") || "{}");
      }

      function renderResults() {
        results.textContent = "";
        records.forEach(function (record) {
          var item = document.createElement("li");
          item.className = "test-result " + (record.passed ? "pass" : "fail");
          var title = document.createElement("strong");
          title.textContent = (record.passed ? "PASS · " : "FAIL · ") + record.name;
          item.appendChild(title);
          if (record.details) {
            var details = document.createElement("small");
            details.textContent = record.details;
            item.appendChild(details);
          }
          results.appendChild(item);
        });

        var passed = records.filter(function (record) { return record.passed; }).length;
        var failed = records.length - passed;
        summary.textContent = passed + " / " + records.length + " 通过" + (failed ? "，有 " + failed + " 项失败" : "");
        summary.dataset.status = failed ? "failed" : "passed";
        window.__NOTES_TEST_RESULTS__ = {
          passed: passed,
          failed: failed,
          total: records.length,
          records: records
        };
        document.documentElement.dataset.testStatus = failed ? "failed" : "passed";
      }

      async function run() {
        try {
          frame.contentWindow.localStorage.clear();
          await loadFrame("../index.html?case=initial");

          var appWindow = frame.contentWindow;
          var doc = appWindow.document;
          var app = appWindow.MarkNotes;

          assert("应用脚本完成初始化", app && app.isStarted(), app ? "MarkNotes 可用" : "未找到 MarkNotes");
          assert("左右两栏布局存在", Boolean(doc.querySelector(".app-shell .sidebar") && doc.querySelector(".app-shell .editor-pane")), "侧栏与编辑区均存在");
          assert("首次访问提供示例笔记", doc.querySelectorAll("[data-testid='note-card']").length >= 3, "可见笔记数：" + doc.querySelectorAll("[data-testid='note-card']").length);
          assert("默认选中一篇笔记并显示内容", doc.querySelector("[data-testid='title-input']").value.length > 0, "标题：" + doc.querySelector("[data-testid='title-input']").value);

          var initialCount = app.state.notes.length;
          click(doc.querySelector("[data-testid='new-note']"));
          await wait(80);
          var createdId = app.state.selectedId;
          assert("新建按钮创建并选中笔记", app.state.notes.length === initialCount + 1 && doc.querySelector("[data-testid='title-input']").value === "", "笔记数：" + app.state.notes.length);
          assert("新建后笔记列表同步更新", doc.querySelectorAll("[data-testid='note-card']").length === initialCount + 1, "列表数：" + doc.querySelectorAll("[data-testid='note-card']").length);

          setInput(doc.querySelector("[data-testid='title-input']"), "自动化测试笔记");
          setInput(doc.querySelector("[data-testid='content-input']"), "持久化测试内容 123");
          await wait(560);
          var saved = storedNotes(appWindow);
          var savedNote = saved.notes.find(function (note) { return note.id === createdId; });
          assert("标题与正文自动保存", savedNote && savedNote.title === "自动化测试笔记" && savedNote.content === "持久化测试内容 123", savedNote ? "已写入 localStorage" : "未找到保存记录");
          assert("编辑后列表显示最新标题", Array.prototype.some.call(doc.querySelectorAll("[data-testid='note-card']"), function (card) { return cardText(card).indexOf("自动化测试笔记") !== -1; }), "列表已刷新");
          assert("字数统计同步更新", doc.getElementById("wordCount").textContent !== "0 字", "显示：" + doc.getElementById("wordCount").textContent);

          click(doc.querySelector("[data-testid='favorite']"));
          await wait(50);
          saved = storedNotes(appWindow);
          savedNote = saved.notes.find(function (note) { return note.id === createdId; });
          assert("收藏状态可切换并保存", savedNote.favorite && doc.querySelector("[data-testid='favorite']").getAttribute("aria-pressed") === "true", "状态：" + savedNote.favorite);

          var search = doc.querySelector("[data-testid='search']");
          setInput(search, "自动化测试");
          await wait(30);
          assert("搜索可匹配标题", doc.querySelectorAll("[data-testid='note-card']").length === 1, "匹配数：" + doc.querySelectorAll("[data-testid='note-card']").length);
          setInput(search, "完全不存在的关键词");
          await wait(30);
          assert("无结果时显示空状态", Boolean(doc.querySelector(".list-empty")) && doc.querySelectorAll("[data-testid='note-card']").length === 0, "显示空状态");
          click(doc.getElementById("searchClear"));
          await wait(30);
          click(doc.querySelector("[data-filter='favorites']"));
          await wait(30);
          var favoriteCount = app.state.notes.filter(function (note) { return note.favorite; }).length; var favoriteCards = doc.querySelectorAll("[data-testid='note-card']"); var allFavoritesShown = Array.prototype.every.call(favoriteCards, function (card) { return cardText(card).indexOf("收藏") !== -1; }); assert("收藏筛选仅显示全部收藏笔记", favoriteCards.length === favoriteCount && favoriteCards.length > 0 && allFavoritesShown, "筛选结果：" + favoriteCards.length + "，收藏总数：" + favoriteCount);
          click(doc.querySelector("[data-filter='all']"));

          click(doc.querySelector("[data-testid='new-note']"));
          await wait(50);
          var xssId = app.state.selectedId;
          setInput(doc.querySelector("[data-testid='title-input']"), '<img src=x onerror="window.__xss=1">');
          setInput(doc.querySelector("[data-testid='content-input']"), '<script>window.__xss=1<\/script>');
          await wait(500);
          assert("笔记内容按纯文本处理", !doc.querySelector("[data-testid='note-list'] img") && typeof appWindow.__xss === "undefined", "未注入可执行元素");

          click(doc.querySelector("[data-testid='delete']"));
          await wait(30);
          assert("删除前显示确认对话框", !doc.querySelector("[data-testid='delete-modal']").hidden, "删除操作需要二次确认");
          click(doc.querySelector("[data-testid='cancel-delete']"));
          await wait(30);
          assert("取消删除保留笔记", app.state.notes.some(function (note) { return note.id === xssId; }), "取消后笔记仍存在");
          click(doc.querySelector("[data-testid='delete']"));
          click(doc.querySelector("[data-testid='confirm-delete']"));
          await wait(70);
          assert("确认删除移除笔记并持久化", !app.state.notes.some(function (note) { return note.id === xssId; }) && !storedNotes(appWindow).notes.some(function (note) { return note.id === xssId; }), "笔记已删除");

          var beforeShortcut = app.state.notes.length;
          doc.dispatchEvent(new KeyboardEvent("keydown", { key: "n", ctrlKey: true, bubbles: true, cancelable: true }));
          await wait(40);
          assert("Ctrl + N 快捷键可新建笔记", app.state.notes.length === beforeShortcut + 1, "笔记数：" + app.state.notes.length);
          var shortcutId = app.state.selectedId;
          setInput(doc.querySelector("[data-testid='title-input']"), "刷新后仍然存在");
          setInput(doc.querySelector("[data-testid='content-input']"), "reload persistence");
          await wait(520);

          await loadFrame("../index.html?case=reload-" + Date.now());
          appWindow = frame.contentWindow;
          doc = appWindow.document;
          app = appWindow.MarkNotes;
          assert("刷新后自动恢复本地笔记", app.state.notes.some(function (note) { return note.id === shortcutId && note.title === "刷新后仍然存在"; }), "标题：" + doc.querySelector("[data-testid='title-input']").value);
          assert("刷新后恢复此前选中笔记", app.state.selectedId === shortcutId && doc.querySelector("[data-testid='title-input']").value === "刷新后仍然存在", "选中 ID：" + app.state.selectedId);

          var themeBefore = doc.documentElement.dataset.theme === "dark" ? "dark" : "light";
          click(doc.getElementById("themeButton"));
          await wait(30);
          var themeAfter = doc.documentElement.dataset.theme;
          assert("主题切换立即生效并保存", themeAfter !== themeBefore && appWindow.localStorage.getItem("mark.theme.v1") === themeAfter, themeBefore + " → " + themeAfter);

          frame.style.width = "390px";
          frame.style.height = "760px";
          await wait(80);
          assert("窄屏显示移动端返回按钮", appWindow.getComputedStyle(doc.getElementById("mobileBackButton")).display === "grid", "display：" + appWindow.getComputedStyle(doc.getElementById("mobileBackButton")).display);
          var themeRect = doc.getElementById("themeButton").getBoundingClientRect();
          var responsiveOverflow = doc.documentElement.scrollWidth - appWindow.innerWidth;
          assert("窄屏关键控件不超出视口", themeRect.right <= appWindow.innerWidth + 1 && themeRect.left >= -1 && responsiveOverflow <= 1, "视口：" + appWindow.innerWidth + "，内容宽：" + doc.documentElement.scrollWidth + "，主题按钮右边界：" + Math.round(themeRect.right));
          click(doc.querySelector("[data-testid='note-card']"));
          await wait(40);
          assert("移动端点选笔记后打开编辑区", doc.body.classList.contains("mobile-editor-open"), "编辑区已打开");
          click(doc.getElementById("mobileBackButton"));
          await wait(40);
          assert("移动端可返回笔记列表", !doc.body.classList.contains("mobile-editor-open"), "编辑区已关闭");
        } catch (error) {
          assert("测试执行过程无异常", false, error && (error.stack || error.message) || String(error));
        }
        renderResults();
      }

      run();
    })();
  </script>
</body>
</html>
